{% extends "base.html" %}
{% block title %}Signals{% endblock %}
{% block nav_signals %}text-yellow-300 font-semibold{% endblock %}

{% block content %}
<div x-data="signalsPage()" x-init="init()" class="space-y-4">

  <!-- Header row -->
  <div class="flex items-center justify-between">
    <h1 class="text-xl font-bold">Pending Signals</h1>
    <div class="flex items-center gap-3">
      <!-- Status filter tabs -->
      <div class="flex rounded-lg border border-gray-300 overflow-hidden text-sm">
        <template x-for="tab in ['all','pending','approved','filled','rejected','failed']" :key="tab">
          <button @click="filter=tab; load()"
                  :class="filter===tab ? 'bg-blue-600 text-white' : 'bg-white text-gray-700 hover:bg-gray-50'"
                  class="px-3 py-1.5 border-r last:border-r-0 border-gray-300 capitalize"
                  x-text="tab">
          </button>
        </template>
      </div>
      <button @click="load()" class="text-gray-500 hover:text-gray-800 text-xl" title="Refresh">↻</button>
    </div>
  </div>

  <!-- Loading / empty states -->
  <div x-show="loading" class="text-gray-400 text-sm">Loading…</div>
  <div x-show="!loading && signals.length === 0" class="text-gray-500 text-sm bg-white rounded-lg p-6 text-center border">
    No signals
    <span x-show="filter !== 'all'" x-text="'with status ' + filter"></span>.
  </div>

  <!-- Signal cards -->
  <template x-for="s in signals" :key="s.id">
    <div class="bg-white rounded-lg border shadow-sm p-4 space-y-2">

      <!-- Top row: id, type, status, date -->
      <div class="flex flex-wrap items-center gap-2">
        <span class="font-mono text-xs text-gray-400" x-text="'#' + s.id"></span>
        <span class="font-semibold text-sm" x-text="s.signal_type"></span>
        <span x-show="s.trade_num" class="text-xs text-gray-500"
              x-text="'trade #' + s.trade_num"></span>
        <span :class="'status-' + s.status.toLowerCase()"
              class="px-2 py-0.5 rounded-full text-xs font-medium"
              x-text="s.status"></span>
        <span class="ml-auto text-xs text-gray-400"
              x-text="new Date(s.created_at).toLocaleString()"></span>
      </div>

      <!-- Expiry / DTE / context row -->
      <div x-show="s.payload.expiration" class="flex flex-wrap gap-3 text-sm text-gray-600">
        <span>
          Expiry <strong x-text="s.payload.expiration"></strong>
        </span>
        <span x-show="s.payload.entry_dte" class="text-blue-600 font-semibold"
              x-text="s.payload.entry_dte + ' DTE'"></span>
        <span x-show="s.payload.entry_vix" class="text-gray-400">
          VIX <span x-text="s.payload.entry_vix?.toFixed(1)"></span>
        </span>
        <span x-show="s.payload.spy_price" class="text-gray-400">
          SPY $<span x-text="s.payload.spy_price?.toFixed(2)"></span>
        </span>
      </div>

      <!-- Strike / price table -->
      <div x-show="s.payload.put_strike || s.payload.call_strike"
           class="overflow-x-auto">
        <table class="text-sm w-auto min-w-[380px]">
          <thead>
            <tr class="text-xs text-gray-400 uppercase">
              <th class="text-left pr-6 py-1 font-medium w-28"></th>
              <th class="text-right pr-6 py-1 font-medium">PUT</th>
              <th class="text-right py-1 font-medium">CALL</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-100">
            <!-- Strike + % OTM -->
            <tr>
              <td class="text-xs text-gray-400 pr-6 py-1">Strike</td>
              <td class="text-right pr-6 py-1 font-semibold">
                <span x-text="s.payload.put_strike"></span>
                <span x-show="s.payload.spy_price && s.payload.put_strike"
                      class="ml-1 text-xs text-gray-400"
                      x-text="'(' + (((s.payload.put_strike - s.payload.spy_price) / s.payload.spy_price) * 100).toFixed(1) + '%)'">
                </span>
              </td>
              <td class="text-right py-1 font-semibold">
                <span x-text="s.payload.call_strike"></span>
                <span x-show="s.payload.spy_price && s.payload.call_strike"
                      class="ml-1 text-xs text-gray-400"
                      x-text="'(+' + (((s.payload.call_strike - s.payload.spy_price) / s.payload.spy_price) * 100).toFixed(1) + '%)'">
                </span>
              </td>
            </tr>
            <!-- IBKR -->
            <tr x-show="s.payload.put_ibkr_mid != null || s.payload.call_ibkr_mid != null">
              <td class="text-xs text-gray-400 pr-6 py-1">IBKR mid</td>
              <td class="text-right pr-6 py-1 text-green-700">
                <span x-show="s.payload.put_ibkr_mid != null"
                      x-text="'$' + s.payload.put_ibkr_mid?.toFixed(2)"></span>
                <span x-show="s.payload.put_ibkr_mid == null" class="text-gray-300">—</span>
              </td>
              <td class="text-right py-1 text-green-700">
                <span x-show="s.payload.call_ibkr_mid != null"
                      x-text="'$' + s.payload.call_ibkr_mid?.toFixed(2)"></span>
                <span x-show="s.payload.call_ibkr_mid == null" class="text-gray-300">—</span>
              </td>
            </tr>
            <!-- yfinance -->
            <tr x-show="s.payload.put_yf_mid != null || s.payload.call_yf_mid != null">
              <td class="text-xs text-gray-400 pr-6 py-1">yfinance mid</td>
              <td class="text-right pr-6 py-1 text-blue-700">
                <span x-show="s.payload.put_yf_mid != null"
                      x-text="'$' + s.payload.put_yf_mid?.toFixed(2)"></span>
                <span x-show="s.payload.put_yf_mid == null" class="text-gray-300">—</span>
              </td>
              <td class="text-right py-1 text-blue-700">
                <span x-show="s.payload.call_yf_mid != null"
                      x-text="'$' + s.payload.call_yf_mid?.toFixed(2)"></span>
                <span x-show="s.payload.call_yf_mid == null" class="text-gray-300">—</span>
              </td>
            </tr>
            <!-- BS theoretical -->
            <tr x-show="s.payload.put_bs_mid != null || s.payload.call_bs_mid != null">
              <td class="text-xs text-gray-400 pr-6 py-1">BS theoretical</td>
              <td class="text-right pr-6 py-1 text-gray-500"
                  x-text="s.payload.put_bs_mid != null ? '$' + s.payload.put_bs_mid?.toFixed(2) : '—'"></td>
              <td class="text-right py-1 text-gray-500"
                  x-text="s.payload.call_bs_mid != null ? '$' + s.payload.call_bs_mid?.toFixed(2) : '—'"></td>
            </tr>
          </tbody>
        </table>

        <!-- Net credit summary -->
        <div x-show="(s.payload.put_ibkr_mid ?? s.payload.put_yf_mid ?? s.payload.put_bs_mid) != null"
             class="mt-2 text-sm flex flex-wrap gap-4">
          <template x-if="(s.payload.put_ibkr_mid ?? s.payload.put_yf_mid) != null">
            <span class="font-semibold text-gray-800">
              Net credit (mkt):
              <span class="text-green-700"
                    x-text="'$' + (((s.payload.put_ibkr_mid ?? s.payload.put_yf_mid ?? 0) + (s.payload.call_ibkr_mid ?? s.payload.call_yf_mid ?? 0)) * 100).toFixed(0) + '/contract'">
              </span>
            </span>
          </template>
          <template x-if="s.payload.put_bs_mid != null">
            <span class="text-gray-400 text-xs">
              BS: $<span x-text="(((s.payload.put_bs_mid ?? 0) + (s.payload.call_bs_mid ?? 0)) * 100).toFixed(0)"></span>/contract
            </span>
          </template>
        </div>
      </div>

      <!-- Fill info -->
      <div x-show="s.fill" class="text-xs text-green-700 bg-green-50 rounded px-3 py-1">
        Filled @ <span x-text="s.fill?.avg_price?.toFixed(2)"></span>
        qty <span x-text="s.fill?.qty"></span>
      </div>

      <!-- Error -->
      <div x-show="s.error_msg" class="text-xs text-red-600 bg-red-50 rounded px-3 py-1"
           x-text="s.error_msg"></div>

      <!-- Actions (pending only) -->
      <div x-show="s.status === 'pending'" class="flex gap-2 pt-1">
        <button @click="approve(s.id)"
                class="bg-green-600 hover:bg-green-700 text-white text-sm px-4 py-1.5 rounded-lg font-medium">
          Approve
        </button>
        <button @click="openReject(s.id)"
                class="bg-red-100 hover:bg-red-200 text-red-700 text-sm px-4 py-1.5 rounded-lg font-medium">
          Reject
        </button>
      </div>
    </div>
  </template>

  <!-- Reject modal -->
  <div x-show="rejectModal.open"
       class="fixed inset-0 bg-black/40 flex items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-xl p-6 w-full max-w-sm space-y-4"
         @click.outside="rejectModal.open=false">
      <h2 class="text-lg font-semibold">Reject Signal #<span x-text="rejectModal.id"></span></h2>
      <input type="text"
             x-model="rejectModal.reason"
             class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-400"
             placeholder="Reason (optional)" />
      <div class="flex gap-2 justify-end">
        <button @click="rejectModal.open=false"
                class="px-4 py-1.5 rounded-lg text-sm text-gray-600 hover:bg-gray-100">
          Cancel
        </button>
        <button @click="submitReject()"
                class="px-4 py-1.5 rounded-lg text-sm bg-red-600 hover:bg-red-700 text-white font-medium">
          Reject
        </button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div x-show="toast" x-transition
       class="fixed bottom-4 right-4 bg-gray-800 text-white text-sm px-4 py-2 rounded-lg shadow-lg"
       x-text="toast"></div>

</div>
{% endblock %}

{% block extra_js %}
<script>
function signalsPage() {
  return {
    signals: [],
    filter: 'pending',
    loading: false,
    toast: '',
    rejectModal: { open: false, id: null, reason: '' },

    async init() {
      if (!getToken()) { window.location.href = '/ui/login'; return; }
      await this.load();
      // Auto-refresh pending/approved every 5 s
      setInterval(() => this.load(), 5000);
    },

    async load() {
      this.loading = true;
      try {
        const qs = this.filter !== 'all' ? '?status=' + this.filter : '';
        this.signals = await api('GET', '/signals' + qs) || [];
      } catch(e) {
        this.showToast('Error: ' + e.message);
      } finally {
        this.loading = false;
      }
    },

    async approve(id) {
      try {
        await api('POST', '/signals/' + id + '/approve');
        this.showToast('Signal #' + id + ' approved');
        await this.load();
      } catch(e) { this.showToast('Error: ' + e.message); }
    },

    openReject(id) {
      this.rejectModal = { open: true, id, reason: '' };
    },

    async submitReject() {
      try {
        await api('POST', '/signals/' + this.rejectModal.id + '/reject',
                  { reason: this.rejectModal.reason });
        this.rejectModal.open = false;
        this.showToast('Signal #' + this.rejectModal.id + ' rejected');
        await this.load();
      } catch(e) { this.showToast('Error: ' + e.message); }
    },

    showToast(msg) {
      this.toast = msg;
      setTimeout(() => this.toast = '', 3000);
    },
  };
}
</script>
{% endblock %}
